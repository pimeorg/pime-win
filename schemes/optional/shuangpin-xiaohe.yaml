# 双拼 · 小鹤方案包（可选，不进入 Windows 默认分发）
#
# 构建：cmake --build build --target pime_optional_schemes
# 产物在 build/optional/schemes/shuangpin-xiaohe/，把整个目录拷到
# %LOCALAPPDATA%\PIME\schemes\ 或在设置里「导入方案包…」。
api: 1
id: shuangpin-xiaohe
name: 双拼 · 小鹤
description: 小鹤双拼（桌面）
version: 1.0.0
chain: shuangpin-xiaohe.cbor
plugins:
  - { id: pime-keymap-default, version: 1.3.0 }
  - { id: pime-shuangpin-standard, version: 1.1.1 }
  - { id: pime-pinyin-parse, version: 1.1.5 }
  - { id: pime-shape-parse, version: 1.0.0 }
  - { id: pime-pinyin-translate, version: 1.4.0 }
  - { id: pime-pinyin-rank, version: 1.4.1 }
  - { id: pime-special-candidates, version: 1.0.0 }
  - { id: pime-shortcuts, version: 1.0.1 }
  - { id: pime-hans-hant, version: 1.0.0 }
  - { id: pime-shape-translate, version: 1.0.0 }
  - { id: pime-english-translate, version: 1.0.6 }
  - { id: pime-emoji-suggest, version: 1.0.0 }
  - { id: pime-clip-code, version: 1.0.0 }
  - { id: pime-candidates-format, version: 1.5.1 }
  - { id: pime-learn-user-dict, version: 1.0.1 }
  - { id: pime-predict-context, version: 1.1.0 }
