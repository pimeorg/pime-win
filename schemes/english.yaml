# 英文方案包（Windows 默认）
#
# 英文模式把可打印键直接交给宿主，这条链供「英文补全」和在组合中补全的宿主使用。
# 链文件由 chainc 从 chains/english.yaml 编译得到。
api: 1
id: english
name: 英文
description: 英文补全（桌面）
version: 1.0.0
chain: english.cbor
plugins:
  - { id: pime-keymap-default, version: 1.3.0 }
  - { id: pime-english-parse, version: 1.0.1 }
  - { id: pime-english-translate, version: 1.0.6 }
  - { id: pime-candidates-format, version: 1.5.1 }
