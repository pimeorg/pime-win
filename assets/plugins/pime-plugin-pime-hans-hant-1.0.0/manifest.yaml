description: 简→繁转换：词组优先最长匹配，重写候选文本
id: pime-hans-hant
version: 1.0.0
abi: { major: 1, minor: 0 }
min_core: "1.0.0"
state_schema: 1
store_schema: 1
runtime: wasm
role: translate
platforms: [windows-x64, windows-arm64, macos-x64, macos-arm64,
            linux-x64, linux-arm64, android-arm64, android-x64, ios-arm64, ios-x64, harmony-arm64, harmony-x64]
entry: pime_process
capabilities: [workspace, asset.read]
requires: []
assets: [hans-hant.tsv]
limits:
  memory_mb: 8
  instructions: 400000
  time_ms: 5
  state_kb: 4
  workspace_kb: 16
  candidates_max: 16
  scratch_bytes: 16384
  max_frame_bytes: 65536
budget: { sync_us: 50, async_ms: 20 }
settings:
  - { key: enabled, type: bool, default: false }
  - { key: comment, type: bool, default: true }
  - { key: max_candidates, type: int, default: 8, min: 1, max: 16 }
