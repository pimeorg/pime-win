description: 预测：从光标周边/剪贴板提取 4-8 位短信验证码
id: pime-clip-code
version: 1.0.0
abi: { major: 1, minor: 0 }
min_core: "1.0.0"
state_schema: 1
store_schema: 1
runtime: wasm
role: predict
platforms: [windows-x64, windows-arm64, macos-x64, macos-arm64,
            linux-x64, linux-arm64, android-arm64, android-x64, ios-arm64, ios-x64, harmony-arm64, harmony-x64]
entry: pime_process
capabilities: [surrounding.read, context.read, workspace]
requires: []
limits:
  memory_mb: 4
  instructions: 200000
  time_ms: 5
  state_kb: 4
  workspace_kb: 8
  candidates_max: 4
  scratch_bytes: 4096
  max_frame_bytes: 16384
budget: { sync_us: 30, async_ms: 20 }
settings:
  - { key: enabled, type: bool, default: true }
  - { key: min_len, type: int, default: 4, min: 3, max: 12 }
  - { key: max_len, type: int, default: 8, min: 3, max: 12 }
  - { key: max_candidates, type: int, default: 3, min: 1, max: 4 }
