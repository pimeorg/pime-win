description: 通用重排：按分数降序、过滤低分、截断
id: pime-rank-default
version: 1.0.0
abi: { major: 1, minor: 0 }
min_core: "1.0.0"
state_schema: 1
store_schema: 1
runtime: wasm
role: rank
platforms: [windows-x64, windows-arm64, macos-x64, macos-arm64,
            linux-x64, linux-arm64, android-arm64, android-x64, ios-arm64, ios-x64, harmony-arm64, harmony-x64]
entry: pime_process
capabilities: [workspace]
requires: []
limits:
  memory_mb: 16
  instructions: 3000000
  time_ms: 5
  state_kb: 32
  workspace_kb: 128
  candidates_max: 32
  scratch_bytes: 16384
  max_frame_bytes: 65536
budget: { sync_us: 50, async_ms: 20 }
settings:
  - { key: min_score, type: int, default: 0, min: 0, max: 1000000 }
  - { key: max_candidates, type: int, default: 16, min: 1, max: 32 }
