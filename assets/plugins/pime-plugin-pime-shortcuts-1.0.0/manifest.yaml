description: 快捷短语与 {date} {time} {weekday} 模板展开
id: pime-shortcuts
version: 1.0.0
abi: { major: 1, minor: 0 }
min_core: "1.0.0"
state_schema: 1
store_schema: 1
runtime: wasm
role: translate
platforms: [windows-x64, windows-arm64, macos-x64, macos-arm64,
            linux-x64, linux-arm64, android-arm64, android-x64, ios-arm64, ios-x64, harmony-arm64, harmony-x64]
entry: pime_process
capabilities: [workspace, asset.read, time]
requires: []
assets: [shortcuts.tsv]
limits:
  memory_mb: 8
  instructions: 300000
  time_ms: 5
  state_kb: 4
  workspace_kb: 16
  candidates_max: 12
  scratch_bytes: 16384
  max_frame_bytes: 65536
budget: { sync_us: 40, async_ms: 20 }
settings:
  - { key: enabled, type: bool, default: true }
  - { key: templates, type: bool, default: true }
  - { key: max_candidates, type: int, default: 4, min: 1, max: 12 }
