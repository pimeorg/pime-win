description: 拼音候选重排：短词加权后按分数降序
id: pime-pinyin-rank
version: 1.4.1
abi: { major: 1, minor: 0 }
min_core: "1.0.0"
state_schema: 2
store_schema: 2
runtime: wasm
role: rank
platforms: [windows-x64, windows-arm64, macos-x64, macos-arm64,
            linux-x64, linux-arm64, android-arm64, android-x64, ios-arm64, ios-x64, harmony-arm64, harmony-x64]
entry: pime_process
capabilities: [workspace, store.kv, time]
requires: [pime-pinyin-translate@^1.0]
limits:
  memory_mb: 16
  instructions: 8000000
  time_ms: 10
  state_kb: 32
  workspace_kb: 128
  candidates_max: 640
  scratch_bytes: 16384
  max_frame_bytes: 65536
budget: { sync_us: 50, async_ms: 20 }
settings:
  - { key: short_boost, type: int, default: 100, min: 0, max: 100000 }
  - { key: cohesion_boost, type: int, default: 1500, min: 0, max: 100000 }
  - { key: learn_boost, type: int, default: 20000, min: 0, max: 1000000 }
  - { key: recent_boost, type: int, default: 4000, min: 0, max: 1000000 }
  - { key: profile_boost, type: int, default: 3000, min: 0, max: 1000000 }
  - { key: profile, type: enum, values: [general, chat, code, formal], default: general }
  - { key: max_candidates, type: int, default: 640, min: 1, max: 640 }
  - { key: page_size, type: int, default: 9, min: 1, max: 640 }
  - { key: user_boost, type: int, default: 8000, min: 0, max: 1000000 }
  - { key: hotword_boost, type: int, default: 12000, min: 0, max: 1000000 }
  - { key: decay_days, type: int, default: 30, min: 0, max: 3650 }
