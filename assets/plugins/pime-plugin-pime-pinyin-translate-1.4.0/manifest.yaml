description: 全拼词典翻译：音节串查词典，产出候选与分数
id: pime-pinyin-translate
version: 1.4.0
abi: { major: 1, minor: 0 }
min_core: "1.0.0"
state_schema: 1
store_schema: 1
runtime: wasm
role: translate
platforms: [windows-x64, windows-arm64, macos-x64, macos-arm64,
            linux-x64, linux-arm64, android-arm64, android-x64, ios-arm64, ios-x64, harmony-arm64, harmony-x64]
entry: pime_process
capabilities: [workspace, asset.read, output.emit]
requires: [pime-pinyin-parse@^1.0]
assets: [pinyin.dict, pinyin.collocations]
limits:
  memory_mb: 32
  instructions: 20000000
  time_ms: 10
  state_kb: 32
  workspace_kb: 128
  candidates_max: 640
  scratch_bytes: 16384
  max_frame_bytes: 65536
budget: { sync_us: 300, async_ms: 20 }
settings:
  - { key: max_candidates, type: int, default: 640, min: 1, max: 640 }
  - { key: fuzzy, type: bool, default: true }
  - { key: collocation_weight, type: int, default: 500, min: 0, max: 2000 }
  - { key: english_passthrough, type: bool, default: true }
  - { key: mixed_uppercase, type: bool, default: true }
