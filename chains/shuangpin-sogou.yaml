# Desktop shuangpin chain, 搜狗双拼 layout. Two keys make one syllable, then
# the same pinyin pipeline as the full-pinyin chain runs.
#
# Compile:
#   python ../pime-public-plugin/tools/chainc chains/shuangpin-sogou.yaml \
#          -o assets/chains/shuangpin-sogou.cbor
api: 1
id: shuangpin-sogou
description: 双拼 · 搜狗（桌面）
core: ">=1.0.0"

plugins:
  - { id: pime-keymap-default, role: preprocess }
  - { id: pime-shuangpin-standard, role: preprocess,
      settings: { scheme: sogou } }
  - { id: pime-pinyin-parse, role: parse }
  - { id: pime-shape-parse, role: parse }
  - { id: pime-pinyin-translate, role: translate,
      settings: { max_candidates: 64 } }
  - { id: pime-pinyin-rank, role: rank,
      settings: { page_size: 6, max_candidates: 64, decay_days: 0 } }
  - { id: pime-special-candidates, role: translate }
  - { id: pime-shortcuts, role: translate }
  - { id: pime-hans-hant, role: translate }
  - { id: pime-shape-translate, role: translate }
  - { id: pime-english-translate, role: translate,
      settings: { max_candidates: 12 } }
  - { id: pime-emoji-suggest, role: predict }
  - { id: pime-clip-code, role: predict }
  - { id: pime-candidates-format, role: format, settings: { page_size: 6 } }
  - { id: pime-learn-user-dict, role: learn }
  - { id: pime-predict-context, role: predict }
  - { id: pime-app-mode, role: learn }
  - { id: pime-dict-packs, role: service }
  - { id: pime-personal-merge, role: service }
  - { id: pime-model-manager, role: service }
