# English word-completion chain. The shell passes printable keys straight
# through in English mode; this chain exists for the status bar's "English
# suggestions" option and for hosts that want completion while composing.
#
# Compile:
#   python ../pime-public-plugin/tools/chainc chains/english.yaml \
#          -o assets/chains/english.cbor
api: 1
id: english-desktop
description: 英文补全（桌面）
core: ">=1.0.0"

plugins:
  - { id: pime-keymap-default, role: preprocess }
  - { id: pime-english-parse, role: parse }
  - { id: pime-english-translate, role: translate,
      settings: { max_candidates: 12 } }
  - { id: pime-candidates-format, role: format, settings: { page_size: 6 } }
